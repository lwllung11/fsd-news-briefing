<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="香港消防／緊急應變相關每日新聞簡報，供消防處官員參考。"
    />
    <title>香港消防／緊急應變新聞簡報</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳至正文</a>

    <header class="site-header">
      <div class="site-header__inner">
        <span class="site-header__badge">消防／緊急應變</span>
        <div class="site-header__title-row">
          <span class="site-header__mark" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="44" height="44" focusable="false">
              <path fill="#c43a45" d="M24 6c-1.2 4.8-6.5 8.2-6.5 14.2 0 3.6 2.4 6.2 5.2 7.4-.8-1.4-1.2-3-1.2-4.7 0-4.3 2.6-7.2 2.6-7.2S29.8 19 29.8 24c0 1.5-.3 2.9-1 4.1 3.2-1.3 5.7-4.2 5.7-8.1C34.5 13.8 26.2 9.2 24 6z"/>
              <path fill="none" stroke="#e8eef8" stroke-width="2.2" stroke-linejoin="round" d="M24 42s-12.5-5.2-12.5-15.8V14.2L24 8.5l12.5 5.7v12C36.5 36.8 24 42 24 42z"/>
              <path fill="none" stroke="#c43a45" stroke-width="1.6" stroke-linejoin="round" opacity="0.9" d="M24 38.2s-8.8-3.6-8.8-11.2v-8.6L24 13.8l8.8 4.6v8.6c0 7.6-8.8 11.2-8.8 11.2z"/>
            </svg>
          </span>
          <h1 id="briefing-title">香港消防／緊急應變新聞簡報</h1>
        </div>
        <p id="briefing-subtitle" class="site-header__subtitle">
          供消防處官員參考嘅每日重點新聞
        </p>
        <p class="site-header__meta">
          <time id="briefing-date"></time>
          <br />
          <span id="updated-at"></span>
        </p>
      </div>
    </header>

    <main id="main">
      <div id="status" class="status" role="status">載入緊簡報內容…</div>
      <nav
        id="filter-bar"
        class="filter-bar"
        aria-label="按分類篩選"
        hidden
      ></nav>
      <nav
        id="day-nav"
        class="day-nav"
        aria-label="按日期跳轉"
        hidden
      ></nav>
      <p id="filter-empty" class="status" hidden>呢個分類暫時冇新聞。</p>
      <ol id="news-list" class="news-list" hidden></ol>
    </main>

    <footer class="site-footer">
      <p id="footer-updated">頁面內容最後更新：—</p>
      <p>內容由 <code>data/news.json</code> 提供 · 僅供內部參考</p>
    </footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
